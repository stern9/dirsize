[package]
name = "dirsize"
version = "0.1.0"
edition = "2024"
description = "Show which directories and files are using your disk space, as a sorted tree"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stern9/dirsize"
readme = "README.md"
keywords = ["disk-usage", "du", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
